name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Superseded pull request runs are cancelled, so that a push per commit does not queue a full
# matrix behind an outdated revision. A push to `main` or a manual run gets a unique group and is
# never cancelled or held behind another run. The timeouts below replace GitHub's 6 hour default
# with headroom over the observed runtime, so a hung job releases its runner.
concurrency:
  group: tests-${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: pytest (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Test (offline)
        # The suite never reaches the network; the key is unset here as well.
        env:
          TYPESAFE_API_KEY: ""
        run: python -m pytest -q
      - name: Self-tests (offline)
        env:
          TYPESAFE_API_KEY: ""
        run: |
          bapu-gate --self-test
          bapu-findings --self-test

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .

  seed-red:
    name: seed-red (the repository proves its own tests)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - name: Every planted defect turns its test red
        env:
          TYPESAFE_API_KEY: ""
        run: bapu-seedred seedred.json
