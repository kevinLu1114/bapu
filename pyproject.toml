[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "bapu"
version = "0.1.0"
description = "Make AI-assisted changes prove themselves before anyone has to trust them."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "kevinLu1114" }]
keywords = [
  "ai-assisted",
  "code-review",
  "mutation-testing",
  "openspec",
  "pytest",
  "specification",
  "testing",
  "verification",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Quality Assurance",
  "Topic :: Software Development :: Testing",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.5"]

[project.urls]
Homepage = "https://github.com/kevinLu1114/bapu"
Issues = "https://github.com/kevinLu1114/bapu/issues"
Changelog = "https://github.com/kevinLu1114/bapu/blob/main/CHANGELOG.md"

[project.scripts]
bapu-gate = "bapu.gate:main"
bapu-seedred = "bapu.seedred:main"
bapu-findings = "bapu.findings:main"

[tool.hatch.build.targets.wheel]
packages = ["src/bapu"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py39"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
